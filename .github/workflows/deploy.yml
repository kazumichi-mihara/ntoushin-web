name: Deploy to AWS S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Build project
      run: npm run build

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::760717061821:role/github-actions-ntoushin-web-deploy
        aws-region: ap-northeast-1

    - name: Sync files to S3
      run: aws s3 sync dist/ s3://www.nantoshin.com --delete

    - name: Invalidate CloudFront cache
      run: aws cloudfront create-invalidation --distribution-id E3E9IYEBC2U4M8 --paths '/*'
